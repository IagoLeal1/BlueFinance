<!-- @dsCard group="Telas" height=280 width=1100 subtitle="Lançamento rápido: toque duplo nas costas → Atalho → confirmação" -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px;align-items:start">
  <figure style="margin:0;display:grid;gap:8px">
    <div class="bf-card" style="display:grid;gap:10px">
      <span class="label muted">1 · Categoria</span>
      <div class="bf-list">
        <div class="bf-row" style="min-height:44px;padding:6px 0"><i data-lucide="shopping-cart" class="bf-icon"></i><span class="body" style="flex:1">Mercado</span><i data-lucide="check" class="bf-icon" style="color:var(--brand)"></i></div>
        <div class="bf-row" style="min-height:44px;padding:6px 0"><i data-lucide="car" class="bf-icon"></i><span class="body">Transporte</span></div>
        <div class="bf-row" style="min-height:44px;padding:6px 0"><i data-lucide="utensils" class="bf-icon"></i><span class="body">Comer fora</span></div>
      </div>
    </div>
    <figcaption class="caption muted">Toque duplo nas costas abre o Atalho “Gasto rápido”. A lista vem das categorias do app.</figcaption>
  </figure>
  <figure style="margin:0;display:grid;gap:8px">
    <div class="bf-card" style="display:grid;gap:10px">
      <span class="label muted">2 · Com o quê?</span>
      <input class="bf-input" value="Mercado do bairro">
    </div>
    <figcaption class="caption muted">Texto livre. Pode ficar em branco: o app usa o nome da categoria.</figcaption>
  </figure>
  <figure style="margin:0;display:grid;gap:8px">
    <div class="bf-card" style="display:grid;gap:10px">
      <span class="label muted">3 · Quanto?</span>
      <div class="bf-amount__value" style="font-size:32px;line-height:38px"><span class="bf-amount__currency">R$</span>32,90</div>
    </div>
    <figcaption class="caption muted">Teclado numérico. O Atalho envia em centavos (3290) para a API.</figcaption>
  </figure>
  <figure style="margin:0;display:grid;gap:8px">
    <div class="bf-card" style="display:flex;gap:12px;align-items:center">
      <span class="bf-cat bf-cat--expense"><i data-lucide="shopping-cart" class="bf-icon"></i></span>
      <div style="flex:1"><div class="body-strong">Gasto salvo</div><div class="caption muted">Mercado · − R$ 32,90</div></div>
      <i data-lucide="circle-check" class="bf-icon is-positive"></i>
    </div>
    <figcaption class="caption muted">Notificação de confirmação. Na fase C (app com Capacitor) ela vira um aviso no Dynamic Island.</figcaption>
  </figure>
</div>
<script>(function(){var s=document.createElement("script");s.src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js";s.onload=function(){lucide.createIcons()};document.head.appendChild(s);})();</script>
