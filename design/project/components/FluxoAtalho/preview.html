<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:16px"><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">1 · Aperta o Botão de Ação e escolhe</span><div class="bf-ios-prompt" style="gap:4px"><div class="bf-ios-prompt__titulo"><span class="bf-ios-notif__icone" style="width:22px;height:22px;border-radius:6px"></span>Gasto rápido</div><div class="bf-ios-prompt__pergunta" style="margin:4px 0 6px">Categoria</div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="house" class="bf-icon "></i><span class="body">Moradia</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="shopping-cart" class="bf-icon "></i><span class="body">Mercado</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="car" class="bf-icon "></i><span class="body">Transporte</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="utensils" class="bf-icon "></i><span class="body">Alimentação</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="ticket" class="bf-icon "></i><span class="body">Lazer</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="heart-pulse" class="bf-icon "></i><span class="body">Saúde</span></div><div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)"><i data-lucide="circle-ellipsis" class="bf-icon "></i><span class="body">Outros</span></div></div><figcaption class="caption muted">A lista vem do app (~0,35 s): categoria nova ou renomeada aparece sozinha. Um toque e já vai para a próxima.</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">2 · Quanto e com o quê?</span><div class="bf-ios-prompt"><div class="bf-ios-prompt__titulo"><span class="bf-ios-notif__icone" style="width:22px;height:22px;border-radius:6px"></span>Gasto rápido · Mercado</div><div class="bf-ios-prompt__pergunta">Quanto e com o quê?</div><div class="bf-ios-prompt__campo">32,90 mercado do bairro</div><div class="bf-ios-prompt__acoes"><span>Cancelar</span><span>OK</span></div></div><figcaption class="caption muted">Um campo só: o número é o valor, o resto é a descrição. Vírgula ou ponto, tanto faz.</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">3 · Notificação de volta</span><div class="bf-ios-notif"><span class="bf-ios-notif__icone"><i data-lucide="check" class="bf-icon " style="color:#fff"></i></span><div style="flex:1"><div class="body-strong">BlueFinance</div><div class="caption">Gasto salvo: Mercado · − R$ 32,90</div></div><span class="caption muted">agora</span></div><figcaption class="caption muted">Uma chamada de rede, no fim. Se algo der errado, a notificação diz o quê (ex.: "Não achei o valor").</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">Como o app lê o texto</span><div class="bf-card" style="display:grid;gap:8px"><div class="caption"><span class="body-strong">32,90 mercado do bairro</span> → R$ 32,90 · "mercado do bairro"</div><div class="caption"><span class="body-strong">almoço 41</span> → R$ 41,00 · "almoço"</div><div class="caption"><span class="body-strong">1.250 aluguel</span> → R$ 1.250,00 · "aluguel"</div><div class="caption"><span class="body-strong">18,40</span> → R$ 18,40 · descrição = categoria</div><div class="caption"><span class="body-strong">uber</span> → "Não achei o valor"</div></div><figcaption class="caption muted">Presente, doação, coisa avulsa: escolha "Outros" na lista.</figcaption></figure></div>
