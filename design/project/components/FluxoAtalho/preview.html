<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:16px"><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">1 · Aperta o Botão de Ação</span><div class="bf-ios-prompt"><div class="bf-ios-prompt__titulo"><span class="bf-ios-notif__icone" style="width:22px;height:22px;border-radius:6px"></span>Gasto rápido</div><div class="bf-ios-prompt__pergunta">Quanto e com o quê?</div><div class="bf-ios-prompt__campo">32,90 mercado do bairro</div><div class="bf-ios-prompt__acoes"><span>Cancelar</span><span>OK</span></div></div><figcaption class="caption muted">Uma pergunta só, sem esperar internet antes. Funciona com capinha. Também dá para chamar pela Siri ou pela Central de Controle.</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">2 · Notificação de volta</span><div class="bf-ios-notif"><span class="bf-ios-notif__icone"><i data-lucide="check" class="bf-icon " style="color:#fff"></i></span><div style="flex:1"><div class="body-strong">BlueFinance</div><div class="caption">Mercado · − R$ 32,90 · Mercado do bairro</div></div><span class="caption muted">agora</span></div><figcaption class="caption muted">Em ~1 s. A categoria foi adivinhada pela palavra "mercado". Errou? Corrige no app tocando no lançamento.</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">3 · Como o app entende</span><div class="bf-card" style="display:grid;gap:8px"><div class="caption"><span class="body-strong">32,90 mercado</span> → R$ 32,90 · Mercado</div><div class="caption"><span class="body-strong">uber 18,40</span> → R$ 18,40 · Transporte</div><div class="caption"><span class="body-strong">almoço 41</span> → R$ 41,00 · Comer fora</div><div class="caption"><span class="body-strong">farmácia 27,50</span> → R$ 27,50 · Saúde</div><div class="caption"><span class="body-strong">presente mãe 120</span> → R$ 120,00 · <span class="body-strong">A revisar</span></div></div><figcaption class="caption muted">O valor é o número; o resto é a descrição. Categoria: palavra-chave, depois o que você usou antes para a mesma palavra. Sem pista, vai como "A revisar".</figcaption></figure></div>
