<!-- @dsCard group="Dados" height=300 subtitle="Linha de lançamento agrupada por dia" -->
<div style="padding:16px;max-width:380px">
  <div class="bf-card" style="padding-top:0;padding-bottom:4px">
    <div class="bf-list__day">Hoje</div>
    <ul class="bf-list">
      <li class="bf-row">
        <span class="bf-cat bf-cat--expense"><i data-lucide="shopping-cart" class="bf-icon"></i></span>
        <div class="bf-row__main"><div class="bf-row__title">Mercado do bairro</div><div class="bf-row__meta">Mercado · Nubank</div></div>
        <span class="bf-row__amount is-negative">− R$ 32,90</span>
      </li>
      <li class="bf-row">
        <span class="bf-cat bf-cat--income"><i data-lucide="sparkles" class="bf-icon"></i></span>
        <div class="bf-row__main"><div class="bf-row__title">Freela site da padaria</div><div class="bf-row__meta">Renda extra · Pix</div></div>
        <span class="bf-row__amount is-positive">+ R$ 850,00</span>
      </li>
      <li class="bf-row">
        <span class="bf-cat bf-cat--invest"><i data-lucide="piggy-bank" class="bf-icon"></i></span>
        <div class="bf-row__main"><div class="bf-row__title">Aporte Tesouro Selic</div><div class="bf-row__meta">Investimento · XP</div></div>
        <span class="bf-row__amount is-invest">R$ 500,00</span>
      </li>
    </ul>
  </div>
</div>
<script>(function(){var s=document.createElement("script");s.src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js";s.onload=function(){lucide.createIcons()};document.head.appendChild(s);})();</script>
