<div class="bf-scrim">
  <div class="bf-sheet" role="dialog" aria-label="Novo lançamento" style="display:grid;gap:16px">

    <div class="bf-sheet__head" style="margin:0"><h2 class="bf-sheet__title">Novo lançamento</h2><button class="bf-iconbtn" aria-label="Fechar"><i data-lucide="x" class="bf-icon"></i></button></div>

        <button class="bf-chip" aria-pressed="false"><i data-lucide="car" class="bf-icon"></i>Transporte</button>

      </div>

    <label class="bf-field"><span class="bf-field__label">Conta</span><input class="bf-input" value="Nubank"></label>
    <button class="bf-btn bf-btn--primary bf-btn--block"><i data-lucide="check" class="bf-icon"></i>Salvar gasto</button>
  </div>
</div>
