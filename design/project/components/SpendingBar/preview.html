<div style="padding:16px;max-width:400px">
  <section class="bf-card">

      <span class="bf-spend__seg" style="flex:21;background:var(--chart-2)" title="Mercado · R$ 762,40"></span>

      <span class="bf-spend__seg" style="flex:4;background:var(--chart-6)" title="Saúde · R$ 145,00"></span>
      <span class="bf-spend__seg" style="flex:2;background:var(--chart-other)" title="Outros · R$ 71,00"></span>

      <li class="bf-spend__item"><span class="bf-spend__dot" style="background:var(--chart-2)"></span>Mercado<span class="bf-spend__val">R$ 762,40</span><span class="bf-spend__pct">21%</span></li>

      <li class="bf-spend__item"><span class="bf-spend__dot" style="background:var(--chart-5)"></span>Lazer<span class="bf-spend__val">R$ 254,50</span><span class="bf-spend__pct">7%</span></li>
