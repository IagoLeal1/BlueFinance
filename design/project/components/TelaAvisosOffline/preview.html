<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:16px"><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">1 · Ajustes › Aviso da fatura</span><div style="display:grid;gap:10px"><section class="bf-card" style="display:grid;gap:10px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><h3 class="bf-card__title">Aviso da fatura</h3><div class="caption muted">Um dia antes e no dia do vencimento, às 9h.</div></div><span style="width:51px;height:31px;border-radius:999px;background:var(--brand);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></span></div><div class="caption" style="color:var(--positive)">Ativado neste iPhone</div><button class="bf-btn bf-btn--ghost" style="justify-self:start;padding:0"><i data-lucide="bell" class="bf-icon "></i>Enviar um aviso de teste</button></section><section class="bf-card" style="display:grid;gap:6px"><h3 class="bf-card__title">Antes de ativar</h3><div class="caption muted">Abra o BlueFin pelo ícone da Tela de Início (Safari › Compartilhar › Adicionar à Tela de Início). É só lá que o iPhone deixa um site mandar avisos.</div></section></div><figcaption class="caption muted">Ativar pede a permissão do iPhone. Vale para este aparelho; em outro, ative de novo. O teste chega na hora.</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">2 · O aviso no iPhone</span><div style="display:grid;gap:10px"><div class="bf-ios-notif"><span class="bf-ios-notif__icone"><i data-lucide="check" class="bf-icon " style="color:#fff"></i></span><div style="flex:1"><div class="body-strong">BlueFin</div><div class="caption">A fatura do C6bank vence amanhã: R$ 1.234,56</div></div><span class="caption muted">9:00</span></div><div class="bf-ios-notif"><span class="bf-ios-notif__icone"><i data-lucide="check" class="bf-icon " style="color:#fff"></i></span><div style="flex:1"><div class="body-strong">BlueFin</div><div class="caption">Hoje vence a fatura do C6bank: R$ 1.234,56</div></div><span class="caption muted">9:00</span></div></div><figcaption class="caption muted">Às 9h, um dia antes e no dia do vencimento, se a fatura tiver valor. Tocar abre o Crédito daquele mês.</figcaption></figure><figure style="margin:0;display:grid;gap:10px;align-content:start"><span class="label muted">3 · Sem internet</span><div style="display:grid;gap:10px"><div role="status" style="display:flex;gap:8px;align-items:center;border-radius:12px;padding:10px 12px;background:var(--ink);color:var(--bg);font:600 13px/18px var(--font-sans)"><i data-lucide="wifi-off" class="bf-icon "></i><span>Sem internet. Mostrando os dados de 14:32; o que você lançar sobe quando ela voltar.</span></div><section class="bf-card" style="padding-top:0;padding-bottom:4px"><div class="bf-list__day">Salvando</div><ul class="bf-list"><li class="bf-row bf-row--pending"><span class="bf-cat bf-cat--expense"><i data-lucide="car" class="bf-icon "></i></span><div class="bf-row__main"><div class="bf-row__title">Uber</div><div class="bf-row__meta">Transporte · Pix · sobe quando a internet voltar</div></div><span class="bf-row__amount is-negative">− R$ 18,40</span></li></ul></section></div><figcaption class="caption muted">O app abre mesmo sem sinal, com o que viu por último. O que você lançar fica "salvando" e é enviado sozinho quando a internet volta — mesmo se fechar o app.</figcaption></figure></div>
