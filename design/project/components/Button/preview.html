<!-- @dsCard group="Ações" height=200 subtitle="Primário, secundário, ghost, destrutivo" -->
<div style="display:grid;gap:12px;padding:16px;max-width:360px">
  <button class="bf-btn bf-btn--primary bf-btn--block"><i data-lucide="check" class="bf-icon"></i>Salvar gasto</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <button class="bf-btn bf-btn--secondary">Adicionar conta</button>
    <button class="bf-btn bf-btn--ghost">Cancelar</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <button class="bf-btn bf-btn--danger">Excluir</button>
    <button class="bf-btn bf-btn--primary" disabled>Salvar</button>
  </div>
</div>
<script>(function(){var s=document.createElement("script");s.src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js";s.onload=function(){lucide.createIcons()};document.head.appendChild(s);})();</script>
